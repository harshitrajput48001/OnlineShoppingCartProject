<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSmart</title>
<style>
body{font-family:Arial;background:#f3f5fa;color:#202638;margin:0}header{background:#263f75;color:white;padding:20px 5%}main{max-width:1050px;margin:25px auto;padding:0 16px}.panel{background:white;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.product{border:1px solid #ddd;padding:14px;border-radius:9px}input,button{padding:10px;margin:5px;border-radius:6px;border:1px solid #ccd}button{background:#3157a4;color:white;border:0;cursor:pointer}.row{display:flex;flex-wrap:wrap;align-items:center}small{color:#68748a}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}#message{padding:12px;color:#17542c}
</style></head><body><header><h2>ShopSmart</h2><div>Online Shopping Cart & Order Management System</div></header><main>
<section class="panel"><h3>1. Customer Registration</h3><div class="row"><input id="cname" placeholder="Customer name"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone"><button onclick="registerCustomer()">Register</button></div><label>Customer ID: <input id="customerId" type="number" value="1" style="width:70px"></label><small>Register first and use the generated ID.</small></section>
<section class="panel"><h3>2. Products</h3><div class="row"><input id="search" placeholder="Search product"><button onclick="loadProducts()">Search</button></div><div id="products" class="grid"></div><details><summary>Add product</summary><div class="row"><input id="pname" placeholder="Name"><input id="pdesc" placeholder="Description"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><button onclick="addProduct()">Save</button></div></details></section>
<section class="panel"><h3>3. Shopping Cart</h3><button onclick="loadCart()">Refresh cart</button><div id="cart"></div><label>Discount % <input id="discount" type="number" value="0" min="0" max="50" style="width:65px"></label><button onclick="checkout()">Place Order</button></section>
<section class="panel"><h3>4. Orders</h3><button onclick="loadOrders()">Refresh orders</button><div id="orders"></div></section><div id="message"></div></main>
<script>
const api='/api';function msg(t){document.getElementById('message').textContent=t}
async function call(path,opts={}){let r=await fetch(api+path,{headers:{'Content-Type':'application/json'},...opts});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.message||'Request failed');return d}
async function loadProducts(){try{let q=document.getElementById('search').value,a=await call('/products?search='+encodeURIComponent(q));document.getElementById('products').innerHTML=a.map(p=>`<div class="product"><b>${p.name}</b><p>${p.description||''}</p><h3>₹${Number(p.price).toFixed(2)}</h3><small>Stock: ${p.stock}</small><p><button onclick="addCart(${p.product_id})">Add to cart</button></p></div>`).join('')||'No products'}catch(e){msg(e.message)}}
async function registerCustomer(){try{let d=await call('/customers',{method:'POST',body:JSON.stringify({name:cname.value,email:email.value,phone:phone.value})});customerId.value=d.customer_id;msg('Customer registered. ID: '+d.customer_id)}catch(e){msg(e.message)}}
async function addProduct(){try{await call('/products',{method:'POST',body:JSON.stringify({name:pname.value,description:pdesc.value,price:Number(price.value),stock:Number(stock.value)})});msg('Product added');loadProducts()}catch(e){msg(e.message)}}
async function addCart(id){try{await call('/cart',{method:'POST',body:JSON.stringify({customerId:Number(customerId.value),productId:id,quantity:1})});msg('Added to cart');loadCart()}catch(e){msg(e.message)}}
async function loadCart(){try{let a=await call('/cart/'+customerId.value),total=0;document.getElementById('cart').innerHTML=a.map(x=>{total+=Number(x.line_total);return `<p>${x.name} × ${x.quantity} — ₹${Number(x.line_total).toFixed(2)} <button onclick="removeItem(${x.product_id})">Remove</button></p>`}).join('')||'Cart is empty';document.getElementById('cart').innerHTML+=`<b>Subtotal: ₹${total.toFixed(2)}</b>`}catch(e){msg(e.message)}}
async function removeItem(id){try{await call('/cart/'+customerId.value+'/'+id,{method:'DELETE'});loadCart()}catch(e){msg(e.message)}}
async function checkout(){try{let d=await call('/checkout',{method:'POST',body:JSON.stringify({customerId:Number(customerId.value),discountPercent:Number(discount.value)})});msg(`Order #${d.orderId} placed. Subtotal ₹${d.subtotal.toFixed(2)}, discount ₹${d.discount.toFixed(2)}, payable ₹${d.total.toFixed(2)}`);loadCart();loadOrders();loadProducts()}catch(e){msg(e.message)}}
async function loadOrders(){try{let a=await call('/orders');document.getElementById('orders').innerHTML='<table><tr><th>Order</th><th>Customer</th><th>Subtotal</th><th>Discount</th><th>Total</th><th>Status</th></tr>'+a.map(o=>`<tr><td>#${o.order_id}</td><td>${o.customer_name}</td><td>₹${o.subtotal}</td><td>₹${o.discount}</td><td>₹${o.total_amount}</td><td>${o.status}</td></tr>`).join('')+'</table>'}catch(e){msg(e.message)}}
loadProducts();
</script></body></html>
